name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ''
      NEON_AUTH_BASE_URL: ''
      NEON_AUTH_COOKIE_SECRET: ci-validation-secret-at-least-32-characters
      NEXT_PUBLIC_APP_URL: https://convivia24.example
      NEXT_PUBLIC_EVENTS_ENABLED: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Browser journeys
        run: npm run test:browser

      - name: Build
        run: npm run build -- --webpack

      - name: Retain failed browser traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-traces
          path: test-results
          retention-days: 7
